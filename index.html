<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>

    <title>Skylo App</title>
  </head>

  <body>
    <div class="weather-app">
      <header>
        <form id="search-form">
          <input
            type="search"
            id="search-form-input"
            placeholder="Enter a city..."
            required
          />
          <input type="submit" value="Search" />
        </form>
      </header>

      <main>
        <div class="weather-app-data">
          <!-- Left side -->
          <div>
            <h1 id="city">Mankato</h1>

            <p class="weather-app-details">
              <span id="time"></span>,
              <span id="description"></span>
              <br />

              Humidity:
              <strong id="humidity">91%</strong>,

              Wind:
              <strong id="wind">4 mph</strong>
            </p>
          </div>
          <div class="weather-app-temperature-container">
            <div id="icon"></div>
            <div id="temperature">23</div>
            <div class="weather-app-unit">°F</div>
          </div>
        </div>
        <div class="weather-forecast" id="forecast"></div>
      </main>

      <footer>
        This project was coded by
        <a
          href="https://www.shecodes.io/graduates/12221-ayan-ibrahim"
          target="_blank"
        >
          Ayan Ibrahim
        </a>
        and is open-sourced on
        <a
          href="https://github.com/Ayan779/Skylo-app"
          target="_blank"
        >
          GitHub
        </a>
        and hosted on
        <a
          href="https://skylo-app.netlify.app/"
          target="_blank"
        >
          Netlify
        </a>.
      </footer>
    </div>

    <script src="index.js"></script>
  </body>
</html>
